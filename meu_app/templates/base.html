<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if title %}{{ title }} - {% endif %}Geoguard AI</title>
  <meta name="description" content="Geoguard AI: IA para detecção de desmatamento e vetores de risco na Amazônia." />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="{{ url_for('main.home') }}" aria-label="Página inicial">
        <img class="logo-img" src="{{ url_for('static', filename='images/logo.png') }}" alt="Geoguard AI" />
        <span>GeoGuard </span>
      </a>
      <nav aria-label="Principal">
        <button class="menu-btn" aria-controls="menu" aria-expanded="false">Menu</button>
        <ul id="menu" role="menu">
          <li role="none"><a role="menuitem" href="{{ url_for('main.home') }}#monitor">Monitoramento</a></li>
          <li role="none"><a role="menuitem" href="{{ url_for('main.relatorios') }}">Relatórios</a></li>
          <li role="none"><a role="menuitem" href="{{ url_for('main.sobre') }}">Sobre</a></li>
          <li role="none"><a role="menuitem" href="{{ url_for('main.contato') }}">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    © <span id="year"></span> GeoGuard  — Todos os direitos reservados
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
